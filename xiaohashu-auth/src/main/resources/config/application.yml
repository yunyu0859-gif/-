server:
  port: 8080 # 项目启动的端口

spring:
  profiles:
    active: dev # 默认激活 dev 本地开发环境
mybatis:
  # MyBatis xml 配置文件路径
  mapper-locations: classpath:/mapper/**/*.xml

# Sa-Token 配置（文档：https://sa-token.cc）
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（秒）：30 天
  timeout: 2592000
  # 最低活跃频率（秒），-1 表示不限制
  active-timeout: -1
  # 允许同一账号多地同时登录
  is-concurrent: true
  # 多次登录同一账号时共用 token
  is-share: true
  # token 风格
  token-style: uuid
  # 输出操作日志
  is-log: true
